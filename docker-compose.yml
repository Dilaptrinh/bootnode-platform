version: '3.8'

services:

  mysql-db:
    image: mysql:8.0
    container_name: web_rental_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your-mysql-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-web_rental}
    ports:
      - "3306:3306"
    volumes:
      - hire-host-new_mysql_data:/var/lib/mysql
    networks:
      - web_rental_net

  redis:
    image: redis:7-alpine
    container_name: web_rental_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - web_rental_net

  backend:
    build:
      context: ./web-rental
      dockerfile: Dockerfile
    container_name: web_rental_backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      APP_BASE_URL: ${APP_BASE_URL:-https://bootnode.cloud}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://bootnode.cloud}
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-bootnode.cloud}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://bootnode.cloud,http://localhost:5173}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}

      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-must-be-at-least-256-bits-long}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-duyb2407571@student.ctu.edu.vn}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}

      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}

      SITE_ROOT_PATH: /srv/hosted-sites

      DEPLOY_ALLOWED_EMAIL_DOMAINS: ${DEPLOY_ALLOWED_EMAIL_DOMAINS:-student.ctu.edu.vn}
      DEPLOY_ALLOWED_EMAILS: ${DEPLOY_ALLOWED_EMAILS:-}

      MANUAL_PENDING_TIMEOUT_MINUTES: ${MANUAL_PENDING_TIMEOUT_MINUTES:-1440}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      CLOUDFLARE_ENABLED: ${CLOUDFLARE_ENABLED:-false}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - hire-host-new_hosted_sites:/srv/hosted-sites
      - backend_logs:/srv/logs
    depends_on:
      - mysql-db
      - redis
    networks:
      - web_rental_net

  frontend:
    build:
      context: ./my-react-app
      dockerfile: Dockerfile
    container_name: web_rental_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - hire-host-new_hosted_sites:/srv/hosted-sites:ro
    depends_on:
      - backend
    networks:
      - web_rental_net

volumes:
  hire-host-new_mysql_data:
    external: true
  hire-host-new_hosted_sites:
    external: true
  redis_data:
  backend_logs:

networks:
  web_rental_net:
    driver: bridge
