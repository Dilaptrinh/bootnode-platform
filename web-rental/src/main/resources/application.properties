spring.application.name=web-rental
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql-db://172.17.192.1:3306/web_rental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis

jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-256-bits-long}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:https://bootnode.cloud}/login/oauth2/code/google

app.oauth2.redirect-uri=${APP_FRONTEND_URL:https://bootnode.cloud}/oauth2/callback

app.auth.admin-emails=${ADMIN_EMAILS:duyb2407571@student.ctu.edu.vn}

payment.momo.partner-code=${MOMO_PARTNER_CODE}
payment.momo.access-key=${MOMO_ACCESS_KEY}
payment.momo.secret-key=${MOMO_SECRET_KEY}
payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.momo.notify-url=${APP_BASE_URL:https://bootnode.cloud}/api/v1/payments/momo/ipn
payment.momo.return-url=${APP_FRONTEND_URL:https://bootnode.cloud}/payment/callback

payment.payos.client-id=${PAYOS_CLIENT_ID:}
payment.payos.api-key=${PAYOS_API_KEY:}
payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payment.payos.endpoint=${PAYOS_ENDPOINT:https://api-merchant.payos.vn/v2/payment-requests}
payment.payos.return-url=${APP_FRONTEND_URL:https://bootnode.cloud}/payment/callback
payment.payos.cancel-url=${APP_FRONTEND_URL:https://bootnode.cloud}/payment/callback
payment.payos.webhook-url=${APP_BASE_URL:https://bootnode.cloud}/api/v1/payments/payos/webhook

site.root-path=${SITE_ROOT_PATH:/srv/hosted-sites}
site.max-size-bytes=${SITE_MAX_SIZE_BYTES:52428800}
site.base-domain=${APP_BASE_DOMAIN:bootnode.cloud}

app.deploy.allowed-email-domains=${DEPLOY_ALLOWED_EMAIL_DOMAINS:student.ctu.edu.vn}
app.deploy.allowed-emails=${DEPLOY_ALLOWED_EMAILS:}

app.payment.manual-pending-timeout-minutes=${MANUAL_PENDING_TIMEOUT_MINUTES:1440}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.contact.email=${CONTACT_EMAIL:duyb2407571@student.ctu.edu.vn}
app.contact.from=${MAIL_USERNAME:}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:55MB}

cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.zone-id=${CLOUDFLARE_ZONE_ID:}
cloudflare.enabled=${CLOUDFLARE_ENABLED:false}
